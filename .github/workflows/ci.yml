name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository. It never publishes
# images, packages or wiki pages, and it needs no repository write token.
permissions:
  contents: read

# A newer push cancels an older run of the same pull request. Runs on main are
# never cancelled, so every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # The browser gate can wait on the dev server and the database for minutes;
    # a hung run must not hold the required check open for the GitHub default
    # of six hours.
    timeout-minutes: 45

    # Postgres 18 + pgvector — must match dev and production. No volume mount,
    # so the PG18 data-dir guard never trips. On stock `postgres:18` `vector` is
    # not even in pg_available_extensions and `pnpm db:deploy` fails.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: jiangtang
          POSTGRES_PASSWORD: jiangtang
          POSTGRES_DB: jiangtang
          TZ: Europe/Berlin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jiangtang -d jiangtang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Main database. `pnpm test` does not write here: test/global-setup.ts
      # derives and provisions the isolated `jiangtang_test` sibling from this
      # URL. The browser gate provisions `jiangtang_e2e` below.
      DATABASE_URL: postgresql://jiangtang:jiangtang@localhost:5432/jiangtang?schema=public
      TZ: Europe/Berlin

    steps:
      # No later step pushes, so the checkout does not keep the token in .git/config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Third-party action, pinned to a commit so a moved v6 tag cannot change what runs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22 # pinned (prod parity) — local dev may run newer
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Golden-rule guards (import bans, mutation funnel, EXCLUDE-column drop).
      - run: bash scripts/guards.sh

      # Negative control for the migration guard: comment-quoted drops must be
      # ignored, executable (including lowercase) drops must be detected.
      - run: bash scripts/guards.sh --self-test

      # The time-targeted backup selector tests. Standard library only: no
      # pip dependencies are installed.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: python3 -m unittest discover -s ops/postgres -p test_select_backup.py

      # ── In-image ops checks ───────────────────────────────────────
      # The suite above tests the RUNNER's Python. The two runs below execute
      # inside the shipped WAL-G image instead, where the restore guard's real
      # ownership tools (chown/chmod/stat/gosu and the postgres account) are the
      # ones under test — only wal-g is stubbed. The image is built once here
      # from the checkout's public ops/postgres directory and reused by both
      # runs; the tag is job-scoped and nothing is pushed or published. A
      # nonzero exit in any of the three fails the job as usual.
      - name: Build the WALG PostgreSQL image
        run: docker build --platform linux/amd64 -f ops/postgres/Dockerfile.walg -t jiangtang-postgres-walg:ci ops/postgres

      - name: In-image restore guard suite
        run: docker run --rm --network none -v "$PWD/ops/postgres:/ops:ro" jiangtang-postgres-walg:ci bash /ops/test-restore-guards.sh

      - name: In-image backup selector suite
        run: docker run --rm --network none -v "$PWD/ops/postgres:/ops:ro" jiangtang-postgres-walg:ci python3 -m unittest discover -s /ops -p test_select_backup.py

      # The production application image (root Dockerfile) is built here and
      # never pushed. Nothing else in this workflow builds it, so a broken
      # Dockerfile would otherwise surface only at deploy time.
      - name: Build the application image
        run: docker build --platform linux/amd64 -t jiangtang:ci .

      # app/generated/ is gitignored — regenerate the client before typecheck.
      - run: pnpm db:generate

      # Apply migrations (incl. the hand-folded EXCLUDE + audit-immutability SQL).
      - run: pnpm db:deploy

      # Production's migrate job runs this same read-only check after
      # `migrate deploy`; without it here a migration that silently loses a
      # hand-written invariant (EXCLUDE constraint, audit trigger, extension)
      # would pass CI and fail only at deploy.
      - name: Verify database invariants
        run: pnpm exec prisma db execute --file ops/postgres/verify-invariants.sql

      # Negative control: the same script with one EXCLUDE constraint dropped
      # inside a transaction that is rolled back (the failing script never
      # reaches its own end, so the connection closing rolls it back too; the
      # trailing ROLLBACK covers a script that unexpectedly passes). It must
      # exit non-zero because of the invariant check, not for another reason.
      - name: Verify the invariant check fails when an invariant is missing
        run: |
          {
            echo 'BEGIN;'
            echo 'ALTER TABLE "EventRoomBooking" DROP CONSTRAINT event_room_no_overlap;'
            cat ops/postgres/verify-invariants.sql
            echo 'ROLLBACK;'
          } > "$RUNNER_TEMP/invariants-negative.sql"
          if output=$(pnpm exec prisma db execute --file "$RUNNER_TEMP/invariants-negative.sql" 2>&1); then
            echo "::error::the invariant check passed although an EXCLUDE constraint was dropped"
            exit 1
          fi
          grep -q 'invariant check FAILED' <<<"$output" || { echo "$output"; echo "::error::the script failed, but not through the invariant check"; exit 1; }
          pnpm exec prisma db execute --file ops/postgres/verify-invariants.sql

      # ── Application image smoke test ─────────────────────────────────────
      # Runs the image built above the way production does: its own migrate job
      # (same command and read-only /ops mount as docker-compose.yml's `migrate`
      # service), then the app in production mode. A runtime image that crashes
      # on boot, or a production-only boot check that refuses to start, would
      # otherwise surface only at deploy. A database of its own keeps this away
      # from the Vitest and browser-gate databases. --network host lets the
      # containers reach the service Postgres and the runner reach the app.
      # Every secret is generated for this job; integrations are explicitly
      # blank and there is no admin bootstrap, so nothing outside is called.
      - name: Smoke-test the application image
        env:
          SMOKE_DATABASE_URL: postgresql://jiangtang:jiangtang@localhost:5432/jiangtang_smoke?schema=public
        run: |
          node --input-type=module -e '
          import pg from "pg";
          const client = new pg.Client({ connectionString: "postgresql://jiangtang:jiangtang@localhost:5432/postgres" });
          await client.connect();
          await client.query("CREATE DATABASE jiangtang_smoke");
          await client.end();
          '

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::docker logs jiangtang-smoke"
              docker logs jiangtang-smoke || true
              echo "::endgroup::"
            fi
            docker rm -f jiangtang-smoke > /dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm --network host --no-healthcheck \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" -e TZ=Europe/Berlin \
            -v "$PWD/ops/postgres:/ops:ro" jiangtang:ci \
            sh -c "./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/prisma db execute --file /ops/verify-invariants.sql"

          BETTER_AUTH_SECRET="$(openssl rand -base64 48)"
          STORAGE_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export BETTER_AUTH_SECRET STORAGE_ENCRYPTION_KEY
          docker run -d --name jiangtang-smoke --network host \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e NODE_ENV=production -e PORT=3000 -e TZ=Europe/Berlin \
            -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL=http://127.0.0.1:3000 \
            -e STORAGE_DIR=/data/uploads -e STORAGE_ENCRYPTION_KEY \
            -e EMBEDDING_BASE_URL= -e RERANK_BASE_URL= -e GENERATION_BASE_URL= \
            -e GLITCHTIP_DSN= -e CALDAV_URL= -e CALDAV_USERNAME= -e CALDAV_PASSWORD= \
            jiangtang:ci

          # Bounded wait: 45 tries, 2 s apart. Each probe is capped at 2 s, so a
          # server that accepts the connection and never answers costs at most
          # 4 s a try instead of stalling the job until its timeout. Only an
          # exact 200 counts as ready: a redirect or an error page is not a
          # healthy application. A container that exited fails at once instead
          # of waiting out the bound.
          for _ in $(seq 1 45); do
            if [ "$(curl -s --connect-timeout 1 --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/healthz 2> /dev/null)" = 200 ]; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' jiangtang-smoke)" != "true" ]; then
              echo "::error::the application container exited before /healthz answered"
              exit 1
            fi
            sleep 2
          done
          [ "${ready:-}" = 1 ] || { echo "::error::/healthz did not return 200 within 45 tries"; exit 1; }

          # bash -e aborts on a failed assignment before the next line runs, so a refused
          # connection or a timeout (curl exits 7 or 28) would end the step with no
          # annotation. Falling back to 000 hands that case to the check below, which fails
          # the step with a message.
          code="$(curl -sS --connect-timeout 2 --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" || code=000
          [ "$code" = 200 ] || { echo "::error::/login returned HTTP $code, expected 200 (000 means no response)"; exit 1; }
          echo "image smoke test passed"

      - run: pnpm typecheck

      # Correctness lint (floating promises, hook deps); formatting is not gated.
      - run: pnpm lint

      # Load-bearing CI guard: EXCLUDE rejects overlaps (23P01); ActivityLog immutable.
      - run: pnpm test

      # Catch build-only breakage (e.g. client/server import mixups) before deploy.
      - run: pnpm build

      # ── Browser gate ─────────────────────────────────────────────────────
      # A database of its own (`jiangtang_e2e`, required suffix by
      # playwright.config.ts validation) so the gate never shares the Vitest
      # database. The service health check has passed before steps run.
      - name: Create isolated E2E database
        env:
          E2E_DATABASE_URL: postgresql://jiangtang:jiangtang@localhost:5432/jiangtang_e2e?schema=public
        run: |
          node --input-type=module - <<'JS'
          import pg from "pg";
          const target = new URL(process.env.E2E_DATABASE_URL);
          const name = decodeURIComponent(target.pathname.replace(/^\//, ""));
          const admin = new URL(process.env.E2E_DATABASE_URL);
          admin.pathname = "/postgres";
          admin.search = "";
          const client = new pg.Client({ connectionString: admin.toString() });
          await client.connect();
          try {
            const { rows } = await client.query(
              "SELECT 1 FROM pg_database WHERE datname = $1",
              [name],
            );
            if (rows.length === 0) {
              await client.query(`CREATE DATABASE "${name.replaceAll('"', '""')}"`);
              console.log(`created database ${name}`);
            } else {
              console.log(`database ${name} already exists`);
            }
          } finally {
            await client.end();
          }
          JS

      # Migrations + the idempotent demo seed, against the E2E database
      # explicitly. prisma.config.ts reads DATABASE_URL; `migrate deploy` never
      # touches a shadow database.
      - name: Migrate and seed the E2E database
        env:
          DATABASE_URL: postgresql://jiangtang:jiangtang@localhost:5432/jiangtang_e2e?schema=public
          DEFAULT_LOCALE: de
        run: |
          pnpm db:deploy
          pnpm db:seed

      - name: Install Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      # The upload-encryption key is generated per job so no key material is
      # committed; the E2E step below picks it up from the job environment.
      - name: Generate a throwaway upload-encryption key
        run: echo "STORAGE_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # Every value below is synthetic and set here. The checkout has no .env
      # file (it is gitignored), so none is read. Names follow playwright.config.ts,
      # e2e/global-setup.ts, test/test-db.ts and the app's boot modules:
      #   - DATABASE_URL_E2E is validated at config evaluation (suffix `_e2e`).
      #   - ADMIN_EMAIL/ADMIN_PASSWORD are the login used by global-setup; the
      #     development seed creates the same account from DEV_ADMIN_*.
      #   - BETTER_AUTH_SECRET signs sessions; STORAGE_* configures encrypted
      #     local uploads (64-hex key, synthetic).
      #   - External integrations (AI endpoints, CalDAV, GlitchTip telemetry)
      #     are explicitly blank, so the run cannot call an outside service.
      - name: E2E browser gate (loopback :3100)
        env:
          E2E_BASE_URL: http://127.0.0.1:3100
          DATABASE_URL_E2E: postgresql://jiangtang:jiangtang@localhost:5432/jiangtang_e2e?schema=public
          DEFAULT_LOCALE: de
          BETTER_AUTH_URL: http://127.0.0.1:3100
          BETTER_AUTH_SECRET: e2e-synthetic-better-auth-secret-not-a-real-credential
          ADMIN_EMAIL: admin@jiangtang.local
          ADMIN_PASSWORD: e2e-synthetic-admin-password
          ADMIN_INITIALS: EA
          DEV_ADMIN_EMAIL: admin@jiangtang.local
          DEV_ADMIN_PASSWORD: e2e-synthetic-admin-password
          STORAGE_DIR: ${{ runner.temp }}/jiangtang-e2e-attachments
          STORAGE_KEY_SALT: e2e-synthetic-salt
          EMBEDDING_BASE_URL: ""
          RERANK_BASE_URL: ""
          GENERATION_BASE_URL: ""
          GLITCHTIP_DSN: ""
          CALDAV_URL: ""
          CALDAV_USERNAME: ""
          CALDAV_PASSWORD: ""
        # `pnpm test:e2e` exits non-zero on any test failure, a global-setup
        # failure (login/route priming) or an incomplete teardown — a browser
        # failure fails the job.
        run: pnpm test:e2e

      # Failure diagnostics only. The paths contain Playwright's HTML report and
      # per-test traces/screenshots from synthetic data; `e2e/.auth` (session
      # state) and environment files are not uploaded. Short retention.
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
