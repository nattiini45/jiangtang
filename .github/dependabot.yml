# Keeps the pinned actions, base images and npm dependencies moving. Updates
# arrive weekly; minor and patch versions are grouped into one pull request per
# ecosystem, and major versions open their own pull requests for review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # @tanstack/react-table 9 replaces useReactTable and the row-model helpers
    # with the feature-based useTable API. Deferred until DataGrid and the column
    # definitions in the routes and components move to it in one change.
    ignore:
      - dependency-name: "@tanstack/react-table"
        update-types:
          - version-update:semver-major
      # The UI SDK betas are pinned on purpose for new interactive components
      # and move only in a deliberate change, never an automatic update.
      - dependency-name: "@ui-sdk/*"
      # These majors are deliberate upgrades, deferred until each is taken on
      # its own; minor and patch updates keep flowing.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: pino
        update-types:
          - version-update:semver-major
      - dependency-name: eslint-plugin-react-hooks
        update-types:
          - version-update:semver-major
      # The Node types track the supported Node majors (22 and 24), so they
      # move with the Node pin, not ahead of it.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The Node major is chosen on purpose and must match CI's setup-node pin, so
    # it moves in one change with CI and the docs, not as a Dockerfile-only bump.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      docker-root-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /ops/postgres
    schedule:
      interval: weekly
    groups:
      docker-postgres-minor-patch:
        update-types:
          - minor
          - patch
