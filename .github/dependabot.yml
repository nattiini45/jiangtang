# Keeps the pinned actions, base images and npm dependencies moving. Updates
# arrive weekly; minor and patch versions are grouped into one pull request per
# ecosystem, and major versions open their own pull requests for review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-root-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /ops/postgres
    schedule:
      interval: weekly
    groups:
      docker-postgres-minor-patch:
        update-types:
          - minor
          - patch
