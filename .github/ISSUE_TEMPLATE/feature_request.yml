name: Feature request
description: Propose a change to an existing feature or a small addition.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Read ROADMAP.md first. Some things are deliberately not planned, and CONTRIBUTING.md says what
        fits the project.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What the application should do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other designs you looked at.
