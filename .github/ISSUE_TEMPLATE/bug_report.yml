name: Bug report
description: Something does not behave as the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not paste credentials, tokens, personal data, uploads or backups. Reproduce with synthetic
        data. Security problems go through the private report linked above, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps and configuration that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      description: The commit hash or release you run.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose (production stack)
        - Development (pnpm dev)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove credentials, tokens and personal data before pasting.
